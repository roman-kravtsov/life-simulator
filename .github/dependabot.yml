version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and local development run Node 22, so the types stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
